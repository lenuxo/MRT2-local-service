[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mrt2-local-service"
version = "0.15.0"
description = "基于 Python、MLX 和 FastAPI 的本地 Magenta RealTime 2 服务"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "magenta-rt[mlx]>=2.0.0,<3",
  "mlx==0.31.2",
  "mido>=1.3,<2",
  "python-multipart>=0.0.20,<1",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
mrt-local = "mrt_local.cli:main"
mrt-download = "mrt_local.download:main"
mrt-serve = "mrt_local.cli:serve_main"

[tool.hatch.build.targets.wheel]
packages = ["mrt_local"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mrt_local"]

[tool.uv]
package = true
